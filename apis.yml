name: ClippPR
description: ClippPR (later rebranded Primeloop) was a startup that helped brands and PR agencies clip
  and track their press coverage, measure the value of earned media, and re-engage audiences by turning
  clicks on shared links into targeted relationships. Founded around 2011 in Las Vegas and part of 500
  Startups' eighth (first San Francisco) accelerator batch, the company has since shut down. Its
  primeloop.com domain is parked/for-sale, primeloop.co no longer resolves, and clipppr.com has been
  taken over by an unrelated blog. No public API, developer portal, or OpenAPI was ever published; the
  only surviving first-party surface is the company's GitHub organization.
